<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FREE ROBUX LEGIT NO CAP</title>
   <script>
        function launchPopup() {
            // Define the dimensions of the popup window
            const width = 400;
            const height = 330;

            // Calculate the maximum safe coordinates on the screen
            const maxX = screen.availWidth - width;
            const maxY = screen.availHeight - height;

            // Generate random X and Y coordinates within the boundaries
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Open the popup at the random position
            window.open(
                '/ransompopup.html', 
                'popup', 
                `width=${width},height=${height},left=${randomX},top=${randomY}`
            );
        }
    </script>
</head>
<body onload="launchPopup()">
    <h1>FREE ROBUX HERE</h1>
    <p>If your browser blocks the automatic popup, click the button below to get FREE robux!!!:</p>
    <button onclick="launchPopup()">Open Popup</button>
</body>
</html>
