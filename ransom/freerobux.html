 <script>
        function launchWindow() {
            // Define the dimensions of the separate window
            const width = 400;
            const height = 330;

            // Calculate the maximum safe coordinates on the screen
            const maxX = screen.availWidth - width;
            const maxY = screen.availHeight - height;

            // Generate random X and Y coordinates within the boundaries
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Using explicit window features instructs the browser to open a separate window
            const windowFeatures = `width=${width},height=${height},left=${randomX},top=${randomY},resizable=yes,scrollbars=yes`;

            // Open the new window
            window.open('ransompopup.html', '_blank', windowFeatures);
        }
    </script>
</head>
